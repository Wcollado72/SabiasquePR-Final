name: Respaldo de la base de datos (Supabase)

# El plan gratis de Supabase NO incluye backups automaticos (confirmado
# 2026-09-27, Settings -> Database -> Backups: "Free Plan does not include
# project backups"). Este workflow es el reemplazo gratis: un pg_dump
# diario de la base real, guardado como artefacto de GitHub Actions.
#
# CIFRADO (AUDITORIA-SEGURIDAD.md, debilidad #4, 2026-10-02): el dump trae
# correos y fechas de nacimiento (datos personales, posiblemente de menores),
# asi que se cifra con `age` ANTES de subirlo. Aqui solo vive la llave PUBLICA
# (publica por diseno: sirve para cifrar, no para abrir). La llave PRIVADA esta
# solo en la PC del dueno (una carpeta privada del dueno) y
# DEBE tener una copia en un gestor de contrasenas / USB: sin ella los
# respaldos son irrecuperables, y quien tenga acceso al repo no puede abrirlos.
#
# Como restaurar un respaldo si hace falta: GitHub -> pestaña "Actions" de
# este repo -> abrir la ejecucion del dia que quieras -> seccion
# "Artifacts" al final -> descargar el .dump.age -> descifrar y restaurar:
#   age -d -i sabiasquepr-llave-respaldos.txt -o respaldo.dump archivo.dump.age
#   pg_restore --clean --if-exists -d "<DATABASE_URL>" respaldo.dump
#
# Requiere un secreto en GitHub: Settings -> Secrets and variables ->
# Actions -> New repository secret -> nombre DATABASE_URL, mismo valor que
# el de Render (el de Session Pooler, no el de conexion directa).
#
# Limitacion honesta: 14 dias de retencion (el limite gratis de
# almacenamiento de Actions es compartido entre todos los artefactos del
# repo) -- no es tan robusto como un plan pagado con point-in-time
# recovery, pero es proteccion real sin costo.

on:
  schedule:
    - cron: '0 7 * * *' # 7:00 UTC diario (~3:00 AM hora de Puerto Rico)
  workflow_dispatch: {} # permite ejecutarlo manualmente desde GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # El repositorio de Ubuntu trae pg_dump 16, pero Supabase corre
      # Postgres 17 -- pg_dump se niega a respaldar un servidor mas nuevo
      # que el mismo (probado 2026-09-27: "aborting because of server
      # version mismatch"). Se instala la version correcta desde el
      # repositorio oficial de PostgreSQL (PGDG) en vez del que trae Ubuntu.
      # Si Supabase sube de version mayor mas adelante, subir el 17 de abajo.
      - name: Instalar cliente de Postgres 17 (pg_dump, desde PGDG)
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17 age

      - name: Respaldar la base de datos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backups
          # Ruta directa al binario 17 -- el runner ya trae una version mas
          # vieja de pg_dump preinstalada en /usr/bin que gana por PATH
          # aunque se instale la 17 encima (probado 2026-09-27).
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" \
            --no-owner --no-privileges --format=custom \
            --file="backups/sabiasquepr-$(date +%Y-%m-%d).dump"

      - name: Cifrar el respaldo (age, llave publica) y borrar el texto plano
        run: |
          for f in backups/*.dump; do
            age -r age1pcha6zxx436d9494n2qdl0k5v0rzsq7la2ga8xr50eu9cw94agrqn3lhjg -o "$f.age" "$f"
            rm -f "$f"
          done
          # Falla el trabajo si por cualquier motivo quedo algo sin cifrar
          test -z "$(ls backups/*.dump 2>/dev/null)"
          ls -la backups/*.age

      - name: Subir el respaldo como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*.dump.age
          retention-days: 14
