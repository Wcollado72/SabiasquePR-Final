# Configuracion de gitleaks (workflow .github/workflows/security-audit.yml).
# Extiende las reglas por defecto y solo permite valores PUBLICOS por diseno,
# uno por uno -- nunca patrones amplios (un patron amplio como "cualquier JWT
# de Supabase" tambien dejaria pasar una llave service_role filtrada).
title = "Sabias que PR"

[extend]
useDefault = true

[allowlist]
description = "Valores publicos por diseno o marcadores de posicion"
regexes = [
  # Llave PUBLICABLE de Supabase: va en el HTML del sitio a proposito (es la
  # llave pensada para ser publica; RLS protege los datos, no esta llave).
  '''sb_publishable_xeRmzsC6kmPflMm7FimG4g_-4mDoSbi''',
  # Valor de relleno cuando STRIPE_SECRET_KEY no esta configurada (dev/tests).
  '''sk_test_placeholder''',
]
