[build]
  command = "node build.js"
  publish = "."
  # Cada deploy a produccion cuesta 15 creditos de Netlify. Si el commit solo toca
  # cosas que NO forman parte del sitio (backend/, docs/, tools/, scripts/, .github/,
  # *.md, render.yaml), Netlify se salta el build. Codigo 0 = saltar; cualquier otro
  # (incluye error por referencia desconocida) = construir, asi que ante la duda se publica.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)backend' ':(exclude)docs' ':(exclude)tools' ':(exclude)scripts' ':(exclude).github' ':(exclude)*.md' ':(exclude)render.yaml' ':(exclude)skills-lock.json'"

# Quien entre por la direccion de Netlify (fabulous-tartufo-fcb839.netlify.app) pasa a
# sabiasquepr.com. Motivo (2026-10-04): Stripe devolvia a los compradores a la direccion de
# Netlify, donde no tenian sesion iniciada (cada dominio guarda su propia sesion) y parecia que
# la sesion se habia caido; ademas evita contenido duplicado ante Google. Solo aplica a ESE
# nombre exacto: los deploy previews y branch deploys (deploy-preview-N--..., main--...) son
# otros nombres y no se tocan. Va primero porque Netlify usa la primera regla que coincide.
[[redirects]]
  from = "https://fabulous-tartufo-fcb839.netlify.app/*"
  to = "https://sabiasquepr.com/:splat"
  status = 301
  force = true

# El repo mezcla el frontend estatico con backend/ y docs/ en la raiz.
# Estas rutas existen como archivos fisicos pero no deben poder
# descargarse desde el sitio publicado.
[[redirects]]
  from = "/backend/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

# El manifiesto se movio de su propia pagina a una seccion dentro de
# Contacto -- 301 real (no rewrite) porque la URL visible SI cambia.
[[redirects]]
  from = "/manifiesto.html"
  to = "/contacto.html#manifiesto"
  status = 301
  force = true

# El Foro general se retiro como pagina propia -- su motor CRUD+JWT ahora
# vive dentro del debate semanal de Corrupcion Humana en Revolucion Humana.
[[redirects]]
  from = "/foro.html"
  to = "/revolucion-humana.html"
  status = 301
  force = true

# La pagina se renombro de nuevos-humanos.html a revolucion-humana.html
# (el nombre "Nuevos Humanos" se libero para usarlo como sub-seccion).
[[redirects]]
  from = "/nuevos-humanos.html"
  to = "/revolucion-humana.html"
  status = 301
  force = true

# Cabeceras de seguridad (CSP, HSTS, X-Frame-Options, etc.): YA NO viven aqui.
# Se generan en cada build en el archivo `_headers` (ver generarHeaders() en
# build.js, donde esta documentado cada dominio permitido) porque el CSP lleva
# el hash SHA-256 de cada script en linea y ese hash cambia cuando cambia el
# script. Netlify lee `_headers` de la carpeta publicada. AUDITORIA-SEGURIDAD.md,
# debilidades #3 y #13.
