services:
  - type: web
    name: sabiasquepr-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PORT
        value: 3000
